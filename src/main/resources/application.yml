server:
port: 8085

spring:
  application:
    name: foj-ai-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas}
      api-key: ${AI_API_KEY:}
      chat:
        completions-path: ${AI_COMPLETIONS_PATH:/v4/chat/completions}
        options:
          model: ${AI_MODEL:glm-4-flash}
          temperature: 0.7
          max-tokens: 1024
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:mysql://localhost:3306/foj_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password:  ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      schema-locations: classpath:db/schema-mysql.sql
      mode: always

ai:
  rate-limit:
    capacity: 10
    window-seconds: 60
